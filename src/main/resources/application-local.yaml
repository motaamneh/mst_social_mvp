spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${MST_DB_URL:jdbc:postgresql://localhost:5432/mst_social_db_mvp}
    username: ${MST_DB_USERNAME:postgres}
    password: ${MST_DB_PASSWORD}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoint:
    health:
      show-details: when-authorized

mst:
  instagram-provider:
    mode: ${MST_INSTAGRAM_PROVIDER_MODE:fake}
  security:
    marker-hmac-key: ${MST_MARKER_HMAC_KEY:local-development-key-that-must-never-be-used-in-production}

spring:
  application:
    name: mst_social_mvp

  datasource:
    url: ${MST_DB_URL}
    username: ${MST_DB_USERNAME}
    password: ${MST_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    clean-disabled: true
    validate-migration-naming: true
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

server:
  port: ${MST_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: tue

mst:
  instagram-provider:
    mode: ${MST_INSTAGRAM_PROVIDER_MODE:searchapi}
    base-url: ${MST_INSTAGRAM_PROVIDER_BASE_URL:}
    allowed-host: ${MST_INSTAGRAM_PROVIDER_ALLOWED_HOST:}
    token: ${MST_INSTAGRAM_PROVIDER_TOKEN:}
  searchapi:
    api-key: ${MST_SEARCHAPI_API_KEY:}
  verification:
    challenge-ttl: PT15M
    maximum-attempts: 5
  security:
    marker-hmac-key: ${MST_MARKER_HMAC_KEY}

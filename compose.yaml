services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mst_social_db_mvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MST_DB_PASSWORD:-mst_social_local_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mst_social_db_mvp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mst_social_postgres_data:/var/lib/postgresql/data

volumes:
  mst_social_postgres_data:
